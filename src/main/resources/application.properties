spring.application.name=creatoros-backend
server.port=8082

spring.main.datasource.url=jdbc:mysql://localhost:3306/creatoros?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.main.datasource.username=root
spring.main.datasource.password=root
spring.main.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.main.datasource.maximum-pool-size=10
spring.main.datasource.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jackson.default-property-inclusion=non_null

app.jwt.secret=Y3JlYXRvcm9zLWxvY2FsLWRldi1zaWduaW5nLWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24=
app.jwt.expiration-ms=604800000

app.otp.ttl-minutes=10
app.otp.max-attempts=5

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

app.invoice.overdue-cron=0 15 0 * * *
app.invoice.timezone=Asia/Kolkata

management.endpoints.web.exposure.include=health,info
