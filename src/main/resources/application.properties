spring.application.name=creatoros-backend
server.port=8082

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/creatoros?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Properties - Flyway owns the schema, Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Jackson - omit nulls so partial profile payloads stay compact
spring.jackson.default-property-inclusion=non_null

# Application
# HS256 signing key, Base64-encoded; must decode to at least 32 bytes.
app.jwt.secret=Y3JlYXRvcm9zLWxvY2FsLWRldi1zaWduaW5nLWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24=
app.jwt.expiration-ms=604800000
app.otp.ttl-minutes=10
app.otp.max-attempts=5
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
# Nightly sweep that flips past-due invoices to Overdue (00:15 IST).
app.invoice.overdue-cron=0 15 0 * * *
app.invoice.timezone=Asia/Kolkata

# Actuator
management.endpoints.web.exposure.include=health,info
